<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telephone formatter
</title>
<link rel="stylesheet" href="index.css">
  </head>
  <body>
    <header>
      <h1>Telephone formatter</h1>
    </header>
   <div class="form-container">
<div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="input-wrapper">
            <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="off" maxlength="16" placeholder="+(123) 456-7890" aria-describedby="phone-format" aria-invalid="false" required="" autofocus="">
            <span class="input-suffix">📞</span>
          </div>
          <div id="phone-format" class="hint">
            Enter a 10-digit phone number. Format: +(123) 456-7890
          </div>
          <div id="phone-error" class="error-message" role="alert" aria-live="polite"></div>
        </div>
   </div>
  </body>
</html>
